# ======================================================================
# Pipeline config - Step 1 -> Step 5
# Edit the two inputs under [paths]; the rest have sensible defaults.
# ======================================================================

[paths]
# --- THE TWO INPUTS YOU PROVIDE ---
# Finished backtest: one folder per strategy, each with a "Trade Level Data" sub-folder.
bt_results_dir = <local-path>
# Raw price data (used by Step 5 / downstream).
raw_data_dir = <local-path>

# --- INTERMEDIATE + OUTPUTS (created automatically; change only if you want them elsewhere) ---
# The shared working folder every step reads/writes (Step 1 creates it).
monthly_rolling_dir = <local-path>
# Step 4's Excel summary lands here.
summary_output_dir = <local-path>
# Step 5's per-year MTM CSVs land here.
mtm_output_dir = <local-path>

[run]
# Which steps to run, in order. Use a subset to resume, e.g. 3,4,5.
steps = 1,2,3,4,5
# Stop the whole pipeline if any step exits non-zero.
stop_on_error = true

[workers]
# --- Performance levers. Defaults are tuned for a ~128 GB box; lower if you have less RAM. ---
# Step 1 (parquet roll-up): processes x threads. NW*TPW ~= your core count.
step1_workers = 8
step1_threads_per_worker = 4
# Step 2 (walk-forward): within-strategy parallelism across cores.
step2_workers = 12
# Step 3 (FT trade level) is the memory-heavy one - each worker caches a folder's trade
# parquets. 8 workers / 40 GB budget was stable on 128 GB; raise only if RAM is plentiful.
step3_workers = 8
step3_mem_budget_gb = 40
# Step 4 (monthly summary): parallel CSV reads.
step4_workers = 16
# Step 5 (MTM data): parallel across strategies.
step5_workers = 12
