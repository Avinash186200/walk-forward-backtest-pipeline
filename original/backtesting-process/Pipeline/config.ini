; ============================================================================
; Pipeline configuration. Edit the values below, save, then run:
;     python run_pipeline.py
; Nothing else needs to change - paths, years, and parameters all come from here.
; ============================================================================

[paths]
; Folder containing the MTM Data files (the "<year> all selected comb ..." csv/xlsx pairs)
mtm_data_dir = ../MTM Data

; Folder containing All_Instruments_Master_D1.csv (the raw price master)
raw_data_dir = ../Raw Data

; Where the pipeline writes everything it produces. Created automatically if missing.
; Final deliverables land in <output_dir>/Final/, intermediate working files in <output_dir>/_intermediate/
output_dir = ../Pipeline Output

[data]
; File-name suffix used in the MTM Data filenames, e.g. "(comm)" -> comm. Must match the files in mtm_data_dir.
tag = comm

; Label used in output file names, e.g. COMM, FX, BOTH
label = COMM

; Years to process, comma-separated (e.g. 2021,2022,2023). Leave blank to auto-detect from mtm_data_dir.
years =

[portfolio]
total_portfolio_capital = 1000000
; Portfolio-level gross exposure cap (fraction of capital), e.g. 0.90 = 90%
max_gross_exposure = 0.90
initial_equity = 1000000

[vol_targeting]
; Lookback window (trading days) for the ex-ante volatility used to size positions
vol_lookback_days = 90

; Which scenario to run for production. Options:
; tv05_cap100, tv05_nocap, tv10_cap100, tv10_nocap, tv14_cap100, tv14_nocap,
; tv16_cap100, tv16_nocap, tv18_cap100, tv18_nocap, tv20_cap100, tv20_nocap
; ("tvNN" = NN% annualised target vol, "cap100" = gross exposure capped at 100%, "nocap" = uncapped)
production_scenario = tv05_cap100

; If true, also computes and saves the full 12-scenario grid (slower - useful for research only)
run_all_scenarios = false

[costs]
; Transaction cost per unit of quantity traded
txn_cost_per_unit = 0.00002
; Daily financing cost rate applied while a position is held overnight
financing_cost_rate = 0.00005
; Per-leg slippage in pips, per Docs/README.md Section 8. Set to 0 to disable.
slippage_pips = 1.0

[run]
; Force rebuilding the volatility wall from raw prices even if a cached copy already exists
force_vol_wall = false

[statistics]
; Number of candidate configs/variants compared when choosing this one (e.g. you ran
; FX/Comm x T+3/T+15 x Combined = 7 variants and picked the best Sharpe). Used only by
; the Deflated Sharpe Ratio in 08_*_Statistical_Tests.xlsx, which raises the bar for
; "is this Sharpe real" the more variants were tried before landing on this one.
; Leave at 1 if this config was not chosen by comparing against others.
n_trials = 1
